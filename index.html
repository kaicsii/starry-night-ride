<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1734">
<title>星夜騎行</title>
<style>
  :root { color-scheme:dark; --gold:#ffe4a5; --ink:#101932; --line:#f3daa355; font-family:Georgia,"Songti TC","Noto Serif TC",serif }
  * { box-sizing:border-box }
  body { margin:0; overflow:hidden; background:#0b1734; color:#fff1ce; user-select:none }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none }
  .shade { pointer-events:none; position:fixed; inset:0; background:linear-gradient(180deg,#07102b9c,transparent 21%,transparent 79%,#060d24c9),radial-gradient(ellipse at center,transparent 62%,#070d3b50) }
  header { position:fixed; top:max(24px,env(safe-area-inset-top)); left:max(30px,env(safe-area-inset-left)); right:max(30px,env(safe-area-inset-right)); display:flex; align-items:flex-start; justify-content:space-between; gap:12px; pointer-events:none }
  .title { display:flex; align-items:center; gap:13px; text-shadow:0 2px 12px #071128 }
  .mark { display:grid; place-items:center; width:40px; height:40px; color:var(--gold); font-size:24px; border:1px solid var(--line); border-radius:50% }
  h1 { font-size:clamp(22px,3vw,36px); font-weight:600; margin:0; letter-spacing:.13em; white-space:nowrap }
  nav { display:flex; gap:4px; padding:4px; border:1px solid var(--line); background:#08152aab; border-radius:4px; pointer-events:auto }
  button { font:inherit; color:#fff3d8; cursor:pointer; touch-action:none }
  nav button { font-size:13px; letter-spacing:.09em; border:0; border-radius:2px; background:transparent; padding:9px 12px; white-space:nowrap }
  nav button[aria-pressed=true] { color:var(--ink); background:#f0d397 }
  button:focus-visible, canvas:focus-visible { outline:2px solid #fff1b0; outline-offset:-3px }
  footer { position:fixed; bottom:max(22px,env(safe-area-inset-bottom)); left:max(30px,env(safe-area-inset-left)); right:max(30px,env(safe-area-inset-right)); border-top:1px solid var(--line); padding-top:12px; display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:12px; letter-spacing:.06em; text-shadow:0 1px 5px #03091c; pointer-events:none }
  .keys { display:flex; flex-wrap:wrap; gap:8px 17px; align-items:center }
  kbd { border:1px solid #e9d4a76b; background:#0b183a80; border-radius:3px; padding:2px 5px; color:#ffe6a9; margin-right:4px; font:11px ui-monospace,monospace }
  #stats { font:11px ui-monospace,monospace; color:#ffe4b1; white-space:nowrap }
  #error { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); max-width:80vw; color:var(--gold); padding:18px; background:#101b32 }
  #touch { display:none }
  .touch #touch { display:block }
  .touch .desktop { display:none }
  .pad,.jump { position:fixed; bottom:calc(max(20px,env(safe-area-inset-bottom)) + 30px); background:#0a173778; border:1px solid #ffde9780; border-radius:50%; display:grid; place-items:center; touch-action:none }
  .pad { width:94px; height:94px; left:max(19px,env(safe-area-inset-left)) }
  .pad::before { content:""; position:absolute; inset:11px; border:1px dashed #f0d4a53b; border-radius:50% }
  .pad i { width:35px; height:35px; border:1px solid var(--gold); background:#e4c07955; border-radius:50%; pointer-events:none }
  .jump { width:66px; height:66px; right:max(19px,env(safe-area-inset-right)); font-size:14px }
  @media(max-width:660px){ header { left:14px; right:14px; top:max(14px,env(safe-area-inset-top)) } .title {gap:7px} .mark { width:26px;height:26px;font-size:17px } nav {gap:0;padding:3px} nav button {font-size:11px;padding:7px} footer {left:16px;right:16px;bottom:max(14px,env(safe-area-inset-bottom));font-size:10px} #stats {font-size:10px} }
</style>
</head>
<body>
<canvas id="world" aria-label="星夜騎行 3D 場景" tabindex="0"></canvas>
<div class="shade" aria-hidden="true"></div>
<header>
  <div class="title"><span class="mark" aria-hidden="true">✦</span><h1>星夜騎行</h1></div>
  <nav aria-label="遊玩模式">
    <button id="auto" aria-pressed="true">自動騎行</button>
    <button id="manual" aria-pressed="false">自己騎</button>
    <button id="tour" aria-pressed="false">全景巡遊</button>
  </nav>
</header>
<footer>
  <div class="keys desktop"><span><kbd>WASD</kbd>騎乘</span><span><kbd>Shift</kbd>奔跑</span><span><kbd>Space</kbd>跳躍</span><span>拖曳轉向 · 滾輪縮放</span></div>
  <div class="keys"><span id="place">向日葵花田</span></div>
  <output id="stats" aria-label="畫面與物理狀態">載入筆觸…</output>
</footer>
<div id="touch"><div class="pad" id="pad" aria-label="虛擬搖桿"><i></i></div><button class="jump" id="jump">跳躍</button></div>
<div id="error" role="alert" hidden></div>
<script type="module">
const $ = id => document.getElementById(id);
const canvas = $('world');
const mobile = matchMedia('(pointer:coarse)').matches || navigator.maxTouchPoints > 0;
document.body.classList.toggle('touch', mobile);
const gl = canvas.getContext('webgl2', {alpha:false, antialias:false, powerPreference:'high-performance'});
function fatal(message) {
  $('error').hidden = false;
  $('error').textContent = message;
  $('stats').textContent = '場景暫停';
}
if (!gl) {
  fatal('這個瀏覽器無法啟用 WebGL2。');
} else {
  start().catch(error => { console.error(error); fatal('場景無法啟動。請重新整理此頁。'); });
}

async function start() {
  const TAU = 2 * Math.PI, Y = [0,1,0], X = [1,0,0], Z = [0,0,1];
  const {sin, cos, sqrt, atan2, hypot, floor, ceil, min, max, abs, exp} = Math;
  const add = (a,b) => a.map((v,i) => v+b[i]);
  const sub = (a,b) => a.map((v,i) => v-b[i]);
  const mul = (a,s) => a.map(v => v*s);
  const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const cross = (a,b) => [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  const unit = a => mul(a,1/(hypot(...a)||1));
  const clamp = (x,a=0,b=1) => max(a,min(b,x));
  const mix = (a,b,t) => a+(b-a)*t;
  const lerp = (a,b,t) => a.map((v,i)=>mix(v,b[i],t));
  const smooth = (a,b,x) => { const t=clamp((x-a)/(b-a)); return t*t*(3-2*t); };
  const angleDiff = (a,b) => atan2(sin(a-b),cos(a-b));
  const frame = (p,u=X,v=Y,w=Z) => [...u,0,...v,0,...w,0,...p,1];
  const yawFrame = (p,a) => frame(p,[cos(a),0,-sin(a)],Y,[sin(a),0,cos(a)]);
  const transform = (m,p) => [0,1,2].map(i=>m[i]*p[0]+m[i+4]*p[1]+m[i+8]*p[2]+m[i+12]);
  function matrixMultiply(a,b) {
    const out = new Float32Array(16);
    for (let i=0;i<16;i++) {
      const row=i%4, j=i-row;
      out[i]=a[row]*b[j]+a[row+4]*b[j+1]+a[row+8]*b[j+2]+a[row+12]*b[j+3];
    }
    return out;
  }
  function cameraMatrix(eye,look,aspect,fov) {
    const back=unit(sub(eye,look)), right=unit(cross(Y,back)), up=cross(back,right);
    const view=[right[0],up[0],back[0],0,right[1],up[1],back[1],0,right[2],up[2],back[2],0,-dot(right,eye),-dot(up,eye),-dot(back,eye),1];
    const f=1/Math.tan(fov/2), n=.16, far=510;
    return matrixMultiply([f/aspect,0,0,0,0,f,0,0,0,0,(far+n)/(n-far),-1,0,0,2*far*n/(n-far),0],view);
  }
  let randomState=2437617;
  function random() {
    randomState^=randomState<<13; randomState^=randomState>>>17; randomState^=randomState<<5;
    return (randomState>>>0)/4294967296;
  }
  const range = (a,b) => mix(a,b,random());
  const coin = p => random()<p;
  const pick = a => a[floor(random()*a.length)];
  const variant = (a,b) => coin(.5)?a:b;
  const dilution = mobile ? .48 : 1;
  const palette = [];
  function paint(dark,light,emission=0) {
    const rgb = hex => [0,2,4].map(i=>parseInt(hex.slice(i,i+2),16)/255);
    palette.push([...rgb(dark),emission,...rgb(light),1]);
    return palette.length-1;
  }
  const P = {
    sod:paint('16243c','446677'), sage:paint('182b3e','547676'), grass:paint('14283d','567b74'), night:paint('0c1935','303f63'),
    path:paint('393a53','9296a1'), edge:paint('282b4f','737890'), dust:paint('424660','989cad'),
    wheat:paint('2b3a48','a4a47d'), seed:paint('313747','c6b583'),
    leaf:paint('102b41','507c72'), leafHi:paint('193344','769477'), petal:paint('866132','e7be63'), goldPetal:paint('a4763c','f5ca70'),
    center:paint('402f39','877251'), pollen:paint('726042','c7a467'),
    pine:paint('0a192d','2a5156'), pineHi:paint('0f2539','47706b'),
    plaster:paint('26364d','7996a8'), white:paint('354f70','a7bed0'), roof:paint('17182d','6d6279'), tile:paint('222842','887a85'),
    timber:paint('232135','6e5a58'), beam:paint('24283a','9b816e'), rock:paint('28384e','798b9f'), rockHi:paint('3b4a64','9caebe'),
    panes:paint('ba6527','ffdc79',.92), lamp:paint('d88a3b','fff0a0',1), lead:paint('302430','8a5c45'),
    bay:paint('3c2634','9c6c55'), hide:paint('523038','c28c64'), mane:paint('171b2b','504553'),
    leather:paint('261a2e','70493e'), brass:paint('785337','dcac64'), cloak:paint('101c59','3769d9'), cloakHi:paint('1b3984','6498df'),
    skin:paint('685057','d6a083'), hat:paint('21233c','796e74'), linen:paint('52617b','c7c6ad'),
    far:paint('2a3d75','637faa'), snow:paint('566a9e','b1c7dd'), mid:paint('202d63','485d91'), near:paint('172746','3b5c7e'),
    blue:paint('101f50','243d83',.75), cobalt:paint('193364','3864a5',.79), teal:paint('245472','488c99',.84),
    foamSky:paint('4b7e9d','a2c4ba',.85), indigo:paint('111a46','27356b',.72), lavender:paint('2c456e','6e8fae',.80),
    corona:paint('88724b','e4bc70',.88), coronaBlue:paint('526580','8a9b9d',.83), amber:paint('be762e','ffd775',.96),
    sun:paint('f0a242','fff2a9',1), ray:paint('997d55','ffdb89',.96),
    water:paint('1c3a60','7299b2'), ripple:paint('365e83','97c2d2'), foam:paint('6389b2','c4dce2'), spray:paint('4b75af','92c3d5')
  };
  const PAL_COUNT=palette.length, PAINTER_GROUPS=24;
  const modelData = new Float32Array(PAINTER_GROUPS*16);
  const placeModel = (id,m) => modelData.set(m,id*16);
  for (let i=0;i<PAINTER_GROUPS;i++) placeModel(i,frame([0,0,0]));
  const paletteTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,paletteTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA32F,2,PAL_COUNT,0,gl.RGBA,gl.FLOAT,new Float32Array(palette.flat()));
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);

  const common= `
    uniform highp sampler2D uPalette;
    uniform vec3 uEye, uLantern;
    uniform float uTime, uPass;
    uniform vec3 uHouse[12];
    vec3 pigments(int id, vec3 p, vec3 normal, float seed){
      vec4 a=texelFetch(uPalette,ivec2(0,id),0);
      vec3 b=texelFetch(uPalette,ivec2(1,id),0).rgb;
      if(a.a>.01) return mix(a.rgb,b,.24+seed*.74);
      vec3 n=normalize(normal);
      float moon=clamp(.21+.77*max(0.,dot(n,normalize(vec3(.54,.73,-.40)))) + (seed-.5)*.5,0.,1.);
      vec3 c=mix(a.rgb,b,moon);
      float gray=dot(c,vec3(.26,.53,.21));
      c=mix(c,vec3(gray)*vec3(.81,.98,1.3),.36)*vec3(.87,.95,1.18);
      vec3 lantern=uLantern-p;
      float d=dot(lantern,lantern);
      float warm=exp(-d*.13)*(.53+.47*max(0.,dot(n,normalize(lantern+vec3(.0001)))));
      for(int i=0;i<12;i++){
        vec3 delta=uHouse[i]-p;
        warm=max(warm,.67*exp(-dot(delta,delta)*.29));
      }
      c=mix(c,b*vec3(1.23,.95,.64)+vec3(.22,.075,.006),clamp(warm,0.,.88));
      float haze=smoothstep(22.,188.,distance(uEye,p))*.60;
      return mix(c,vec3(.225,.337,.485),haze);
    }
  `;
  const brushVS=`#version 300 es
    precision highp float;
    layout(location=0) in vec3 aPos;
    layout(location=1) in vec3 aTangent;
    layout(location=2) in vec3 aSide;
    layout(location=3) in vec3 aData;
    uniform mat4 uVP,uModel[${PAINTER_GROUPS}];
    uniform vec2 uPixels;
    uniform float uLayer,uQuality;
    out vec2 vUv;
    out vec3 vPos;
    flat out vec3 vPigment;
    flat out float vSeed,vFade;
    ${common}
    const vec2 corners[4]=vec2[4](vec2(-1,-1),vec2(1,-1),vec2(-1,1),vec2(1,1));
    void main(){
      mat4 model=uModel[int(aData.y)];
      vec3 p=(model*vec4(aPos,1.)).xyz;
      vec3 tangent=mat3(model)*aTangent, side=mat3(model)*aSide;
      vec3 normal=normalize(cross(tangent,side));
      float seed=aData.z, dist=distance(p,uEye);
      float fade=1., grow=1.;
      if(uLayer<.5 && aData.y<.5){
        float cutoff=mix(105.,11.,pow(seed,1.6))*uQuality;
        if(uPass>.5) cutoff*=.78;
        cutoff*=mix(.64,1.15,smoothstep(.06,.44,length(tangent)));
        fade=1.-smoothstep(cutoff*.69,cutoff,dist);
        grow=1.+smoothstep(7.,64.,dist)*.94;
        p+=normal*min(.23,dist*.0021)*(.2+seed*.80);
      }
      if(uLayer>.5 && uLayer<1.5){
        float wind=sin(aPos.y*.023+aPos.x*.013+uTime*.092+seed*.38);
        p+=tangent*wind*.51+side*cos(uTime*.11+aPos.x*.021)*.31;
      }
      if(uLayer>4.5){
        fade=1.-smoothstep(166.+seed*53.,216.+seed*68.,dist);
        grow=1.32;
      }
      if(uLayer>1.5 && uLayer<2.5){
        fade=1.-smoothstep(10.,17.,dist);
        p+=tangent*sin(p.x*.5+p.z*.46+uTime*2.4)*.18;
      }
      if(uLayer>2.5 && uLayer<3.5){
        p.x+=sin(uTime*2.+p.z)*.045;
        p.z+=sin(uTime*1.3+p.x*.2)*.12;
      }
      if(uLayer>3.5 && uLayer<4.5){
        p.y-=fract(seed+uTime*.33)*.68;
        p.x+=sin(seed*66.+uTime*.9)*.08;
      }
      vec4 center=uVP*vec4(p,1.);
      if(center.w<.14 || fade<=.002 || any(greaterThan(abs(center.xy),center.ww*1.32))){
        gl_Position=vec4(2.,2.,2.,1.); return;
      }
      vec4 deltaT=uVP*vec4(tangent*grow,0.), deltaS=uVP*vec4(side*grow,0.);
      float pixT=length((deltaT.xy-center.xy/center.w*deltaT.w)*uPixels/center.w);
      float pixS=length((deltaS.xy-center.xy/center.w*deltaS.w)*uPixels/center.w);
      float limitS=uLayer>.5&&uLayer<1.5?18.:17.;
      deltaT*=clamp(pixT,1.3,56.)/max(pixT,.36);
      deltaS*=clamp(pixS,.40,limitS)/max(pixS,.19);
      vec2 corner=corners[gl_VertexID];
      gl_Position=center+(deltaT*corner.x+deltaS*corner.y)*mix(.13,1.,fade);
      vUv=corner; vSeed=seed; vPos=p; vPigment=pigments(int(aData.x),p,normal,seed); vFade=fade;
    }`;
  const brushFS=`#version 300 es
    precision highp float;
    in vec2 vUv;
    in vec3 vPos;
    flat in vec3 vPigment;
    flat in float vSeed,vFade;
    uniform float uLayer,uPass,uTime;
    uniform sampler2D uReflection;
    uniform mat4 uReflectVP;
    out vec4 frag;
    float hash(float x){return fract(sin(x*127.1)*43758.54);}
    void main(){
      if(uPass>.5 && uLayer<.5 && vPos.y<-.51) discard;
      float across=(vUv.y*.5+.5)*11.;
      float hair=floor(across);
      float fiber=hash(hair+vSeed*49.);
      float groove=cos(fract(across)*6.283185)*(1.-smoothstep(.40,1.1,fwidth(across)));
      float tip=1.-abs(vUv.x)*(.10+fiber*.15);
      float shape=1.-pow(abs(vUv.y)/tip,2.8)-pow(abs(vUv.x)*(.94+.15*fiber),5.);
      float alpha=smoothstep(-.06,.14,shape)*vFade;
      if(alpha<.035) discard;
      float ridge=.98+.11*groove+.055*sin(vUv.x*13.+fiber*5.)+
        .18*(.48-abs(vUv.y+.23)) + .19*smoothstep(.13,.48,shape)*(1.-smoothstep(.47,.75,shape));
      vec3 color=vPigment*ridge;
      if(uLayer>2.5 && uLayer<3.5){
        vec4 q=uReflectVP*vec4(vPos,1.);
        vec2 uv=q.xy/q.w*.5+.5;
        uv.x+=.009*sin(vPos.z*6.+vPos.x+uTime*2.);
        uv.y+=.007*cos(vPos.x*5.+vPos.z*2.-uTime*1.6);
        vec3 reflected=texture(uReflection,clamp(uv,.004,.996)).rgb;
        color=mix(color,reflected*ridge,.45+vSeed*.30);
        alpha*=.72;
      }
      if(uLayer>3.5 && uLayer<4.5) alpha*=.83;
      frag=vec4(color,alpha*.98);
    }`;
  const solidVS=`#version 300 es
    precision highp float;
    layout(location=0) in vec3 aPos;
    layout(location=1) in vec3 aNormal;
    layout(location=2) in vec3 aData;
    uniform mat4 uVP,uModel[${PAINTER_GROUPS}];
    out vec3 vPos,vNormal;
    out float vPaint,vSeed;
    void main(){
      mat4 model=uModel[int(aData.y)];
      vec4 p=model*vec4(aPos,1.);
      vPos=p.xyz; vNormal=mat3(model)*aNormal; vPaint=aData.x; vSeed=aData.z;
      gl_Position=uVP*p;
    }`;
  const solidFS=`#version 300 es
    precision highp float;
    in vec3 vPos,vNormal;
    in float vPaint,vSeed;
    uniform sampler2D uReflection;
    uniform mat4 uReflectVP;
    uniform float uLayer;
    out vec4 frag;
    ${common}
    void main(){
      if(uPass>.5 && uLayer<.5 && vPos.y<-.51) discard;
      int id=int(floor(vPaint+.5));
      vec3 c=pigments(id,vPos,vNormal,vSeed);
      if(uLayer>.5 && uLayer<1.5){
        vec3 d=normalize(vPos);
        float n=sin(d.x*17.+sin(d.z*11.+d.y*12.))+sin(d.y*40.+d.x*18.);
        c=mix(vec3(.044,.073,.18),vec3(.16,.265,.44),pow(clamp(1.-max(0.,d.y)*2.1,0.,1.),2.))+.027*n;
      }
      if(uLayer>2.5 && uLayer<3.5){
        vec4 r=uReflectVP*vec4(vPos,1.);
        vec2 uv=r.xy/r.w*.5+.5;
        vec2 wave=vec2(sin(vPos.z*8.+vPos.x*2.+uTime*2.),sin(vPos.x*4.+vPos.z*2.-uTime*2.1));
        vec3 refl=texture(uReflection,clamp(uv+wave*vec2(.008,.005),.004,.996)).rgb;
        float fresnel=1.-max(0.,dot(normalize(uEye-vPos),vec3(0,1,0)));
        c=mix(vec3(.05,.18,.27),refl,.52+.30*fresnel)+.038*wave.y;
      } else if(uLayer<.5){
        float mottling=sin(vPos.x*6.7+sin(vPos.z*3.6))*sin(vPos.z*9.3+vPos.y*7.2);
        c*=.86+.20*mottling;
      }
      frag=vec4(c,1.);
    }`;
  function program(vs,fs) {
    const p=gl.createProgram();
    for (const [type,source] of [[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]]) {
      const shader=gl.createShader(type);
      gl.shaderSource(shader,source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
      gl.attachShader(p,shader); gl.deleteShader(shader);
    }
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    for (const name of ['VP','ReflectVP','Model','Eye','Lantern','House','Time','Layer','Quality','Pass','Pixels','Palette','Reflection'])
      u[name]=gl.getUniformLocation(p,'u'+name);
    return {p,u};
  }
  const brushes=program(brushVS,brushFS), solids=program(solidVS,solidFS);
  function batch(layer=0, bounds=null) { return {layer,bounds,strokes:[],mesh:[],count:0}; }
  let builtStrokes=0;
  const scenery=batch(), actors=batch(), skyline=batch(1), water=batch(3), cascade=batch(4), mountains=batch(5);
  function stroke(b,p,u,v,l,w,id,g=0,seed=random()) {
    for(const x of p) b.strokes.push(x);
    for(const x of u) b.strokes.push(x*l);
    for(const x of v) b.strokes.push(x*w);
    b.strokes.push(id,g,seed);
  }
  function triangle(b,a,c,d,n,id,g=0,seed=.48) {

      }
    }
    horse.yaw+=clamp(angleDiff(targetYaw,horse.yaw),-dt*4.4,dt*4.4);
    if(wanted>0) wanted*=mix(.40,1,1-clamp(abs(angleDiff(targetYaw,horse.yaw))/2.15));
    const swimming=horse.y<lakeY-.28;
    if(swimming) wanted*=.53;
    horse.speed=mix(horse.speed,wanted,1-exp(-dt*(wanted===0?7.5:4.3)));
    if(willJump&&horse.ground){horse.vy=5.15;horse.ground=false;horse.jump=true;}
    horse.vy-=gravity*dt;
    const dx=-sin(horse.yaw)*horse.speed*dt,dz=-cos(horse.yaw)*horse.speed*dt;
    const next=rapier?rapierMove(dx,horse.vy*dt,dz):fallbackMove(dx,horse.vy*dt,dz);
    const motion=hypot(next.x-horse.x,next.z-horse.z);
    horse.travel+=motion;
    if(next.ground&&horse.vy<=0){horse.vy=-.37;horse.jump=false;}
    else if(next.y<horse.y+.0003&&horse.vy>0) horse.vy=0;
    Object.assign(horse,next);
    horse.step+=motion*3.45;
    if(mode==='tour') tourTime+=dt;
  }
  const rotateX=a=>frame([0,0,0],X,[0,cos(a),sin(a)],[0,-sin(a),cos(a)]);
  const rotateZ=a=>frame([0,0,0],[cos(a),sin(a),0],[-sin(a),cos(a),0],Z);
  function bone(p,q,length){
    const y=mul(sub(p,q),1/length), z=unit(cross(X,y));
    return frame(p,unit(cross(y,z)),y,z);
  }
  function pose(){
    const phase=horse.step, motion=smooth(.1,5.5,horse.speed), bob=(sin(phase*2)*.048+.014)*motion;
    const jumpPitch=horse.jump?clamp(horse.vy*.048,-.25,.26):0;
    const root=yawFrame([horse.x,horse.y+bob,horse.z],horse.yaw);
    const lean=matrixMultiply(root,rotateX(jumpPitch));
    placeModel(1,lean);
    placeModel(2,matrixMultiply(frame(sailCenter),rotateZ(clock*.335+.26)));
    const rider=matrixMultiply(lean,frame([0,1.91+sin(phase*2+.62)*.036*motion,.10]));
    const sway=matrixMultiply(rider,rotateZ(sin(phase)*.058*motion));
    placeModel(3,sway);
    const lamp=matrixMultiply(matrixMultiply(sway,frame(lampAnchor)),rotateX(sin(phase-.3)*(.13+motion*.24)+jumpPitch*.61));
    placeModel(4,lamp);lantern=transform(lamp,[0,-.34,.05]);
    const tail=matrixMultiply(matrixMultiply(lean,frame([0,1.57,1.00])),rotateZ(sin(phase*.68+clock*1.5)*.28));
    placeModel(8,matrixMultiply(tail,rotateX(-.22+sin(phase)*.12*motion)));
    for(let i=0;i<4;i++){
      const side=i%2===0?-1:1, hind=i>1;
      const cycle=phase+(i===0||i===3?0:Math.PI);
      const extend=sin(cycle)*.37*motion, lift=max(0,cos(cycle))*motion;
      const hip=[side*(hind?.32:.265),1.23,hind?.72:-.67];
      const knee=[side*(hind?.315:.268),.62+lift*.15+(horse.jump?.11:0),hip[2]+(hind?.105:-.09)+extend*.51];
      const foot=[side*(hind?.32:.268),.12+lift*.30+(horse.jump?(hind?.16:.47):0),hip[2]+extend+(horse.jump?(hind?.15:-.35):0)];
      placeModel(9+i*2,matrixMultiply(lean,bone(hip,knee,.66)));
      placeModel(10+i*2,matrixMultiply(lean,bone(knee,foot,.57)));
    }
  }
  const views=[
    [[7.9,8.0,30.9],[-2,4.9,-.7]],
    [[-28,13.7,17],[-4.5,5.0,-14]],
    [[-25.4,13.4,-9.7],[-8.5,6,-29.7]],
    [[-5.4,15.6,-43.5],[9.7,5.1,-20.7]],
    [[15.2,15.2,-23.2],[28.8,5.1,-40.5]],
    [[40.5,10.2,-23.4],[13.2,5.6,-4.8]],
    [[riverX(8),4.75,8],[23.05,2.4,-23.5]],
    [[26.3,12.1,28.8],[4.4,4.6,-2.4]]
  ];
  function tourView(time) {
    const step=(time/7.5)%views.length,s=floor(step),t=step-s;
    return [0,1].map(j=>[0,1,2].map(k=>{
      const at=i=>views[(i+views.length)%views.length][j][k];
      return catmull(at(s-1),at(s),at(s+1),at(s+2),t);
    }));
  }
  function updateCamera(dt){
    if(mode==='auto'||mode==='tour') smoothYaw+=angleDiff(horse.yaw,smoothYaw)*dt*1.52;
    let desiredEye,desiredLook;
    if(mode==='tour') {
      [desiredEye,desiredLook]=tourView(tourTime);
    } else {
      const a=smoothYaw+orbit, back=zoom*cos(pitch);
      desiredEye=[horse.x+sin(a)*back,horse.y+1.58+zoom*sin(pitch),horse.z+cos(a)*back];
      desiredEye[1]=max(desiredEye[1],floorAt(desiredEye[0],desiredEye[2])+.63);
      const spread=mobile?3.7:5.3;
      desiredLook=[horse.x-sin(a)*spread,horse.y+mix(3.1,4.04,smooth(3.9,9,zoom)),horse.z-cos(a)*spread];
    }
    smoothEye=smoothEye?lerp(smoothEye,desiredEye,1-exp(-dt*4.8)):desiredEye;
    smoothLook=smoothLook?lerp(smoothLook,desiredLook,1-exp(-dt*5.3)):desiredLook;
    return [smoothEye,smoothLook];
  }
  function location(){
    const [x,,z]=mode==='tour'?smoothLook:[horse.x,0,horse.z];
    if(z< -35&&x>17) return '岩壁瀑布';
    if(bridgeZones.some(b=>hypot(x-b.p[0],z-b.p[2])<7)) return '河上石橋';
    if(x>21) return '月光河畔';
    if(x<1&&z< -19) return '尖塔村莊';
    if(x> -3&&z< -7) return '麥田';
    if(x>5&&z<11) return '風車小屋';
    return '向日葵花田';
  }
  let before=0,accum=0, frameMean=16.7, rated=0, budgetTime=0, statusTime=0;
  function animate(now){
    requestAnimationFrame(animate);
    const ms=before?now-before:16.7;
    before=now;
    const dt=clamp(ms/1000,.001,.10);
    clock+=dt;
    accum+=dt;
    while(accum>=stepTime){tick(stepTime);accum-=stepTime;}
    pose();
    const [eye,look]=updateCamera(dt);
    grassAround(eye[0],eye[2]);
    frameMean=mix(frameMean,min(ms,280),.055);
    budgetTime+=dt;statusTime+=dt;
    if(budgetTime>1.3){
      budgetTime=0;
      if(frameMean>25) quality=max(mobile?.50:.46,quality*.85);
      else if(frameMean<17.2) quality=min(1,quality+.06);
    }
    resize();
    const fov=(canvas.width/canvas.height<.90?68:56)*Math.PI/180;
    const vp=cameraMatrix(eye,look,canvas.width/canvas.height,fov);
    if(needReflection||passes%(quality<.73?7:4)===0){
      reflectVP=matrixMultiply(vp,reflectionTransform);
      render(reflectVP,[eye[0],2*lakeY-eye[1],eye[2]],true);
      needReflection=false;
    }
    render(vp,eye);passes++;
    if(statusTime>.38||passes===1){
      statusTime=0;rated=Math.round(1000/frameMean);
      $('place').textContent=location();
      $('stats').textContent=`${rated} FPS · ${Math.round(quality*100)}% · ${physicsLabel}`;
    }
  }
  canvas.addEventListener('webglcontextlost',()=>fatal('繪圖裝置中斷。請重新整理以回到小徑。'));
  requestAnimationFrame(animate);
}
</script>
